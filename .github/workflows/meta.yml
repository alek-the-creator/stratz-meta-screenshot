name: Daily STRATZ Meta Screenshot

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC (u nás ~08:00 v zime / ~09:00 v lete)
  workflow_dispatch:       # aby si to vedel spustiť aj ručne

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright (Chromium)
        run: npm run pw:install

      - name: Install deps
        run: npm ci

      - name: Run screenshot + send to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run scrape
