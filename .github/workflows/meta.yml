name: Daily STRATZ Meta Screenshot

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Install deps
        run: npm install   # <— namiesto "npm ci"

      - name: Run screenshot + send to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node screenshot.js  # alebo: npm run scrape
