name: Daily STRATZ Meta Screenshot

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # ← bez "cache: 'npm'"

      - name: Install browsers (cached)
        uses: microsoft/playwright-github-action@v1
        with:
          with-deps: true

      - name: Install deps
        run: npm install

      - name: Check STRATZ_TOKEN presence
        run: echo "Has STRATZ_TOKEN? ${{ secrets.STRATZ_TOKEN != '' }}"

      - name: Run screenshot + send to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: node screenshot.js
